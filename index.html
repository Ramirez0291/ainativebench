<script>
const LV=[0,.25,.5,.75,1];
const LVNAME=['空白','萌芽','试水','推进','原生'];

const Y_ITEMS=[
 {id:'y1',name:'准入政策与企业级基建',en:'Access Policy & Enterprise Infrastructure',w:15,
  focus:'区分「草台班子」与「正规军」的第一道门槛：① 集中账号与 SSO　② 合同约定数据不用于训练　③ 管理员可控权限与功能开关　④ 审计日志　⑤ 数据保留期可控。满足 1–2 项约 50%，3–4 项约 75%。',

 {id:'y2',name:'企业知识库沉淀',en:'Enterprise Knowledge Base · stack-agnostic',w:20,

 {id:'y3',name:'业务流加速方式',en:'Workflow Acceleration · beyond the chat box',w:20,

 {id:'y4',name:'生产业务介入深度',en:'Depth in Core Production',w:15,

// 每个象限内按顺序判定，第一个命中的亚型胜出；都不命中则取该象限的 _default。
// h.raw = 原始自评档位，h.lv = 护栏门槛修正后档位（仅 Y4 可能不同），h.trap = 反模式答「是」，h.z = 稳定度答案。
const PERSONA_RULES={
 bl:[
  ['lamplighter',h=>h.z.z1===false&&h.z.z2===false&&h.z.z6===false],

 ],
 tl:[

 ],

const r1=n=>Math.round(n*10)/10;
function compute(){
  const it={}; const notes=[];
  for(const i of ALL){
    let lv=S.scores[i.id]??0, capped=false;
    if(i.id==='y4' && (S.scores.y5??0)<2 && lv>2){lv=2;capped=true}
    const hits=ALLTRAPS.filter(t=>t.link===i.id && S.traps[t.id]===true);
    const down=(S.evid[i.id]?0:1)+(hits.length?1:0);
    const clv=Math.max(0,lv-down);
    it[i.id]={raw:S.scores[i.id]??0,lv,clv,capped,hits,score:i.w*LV[lv],cscore:i.w*LV[clv]};
  }
  const sum=(arr,k)=>arr.reduce((a,i)=>a+it[i.id][k],0);
  const Y=sum(Y_ITEMS,'score'),X=sum(X_ITEMS,'score'),Yc=sum(Y_ITEMS,'cscore'),Xc=sum(X_ITEMS,'cscore');
  const total=(x,y)=>{const pen=Math.max(0,0.6*(y-x-20));return{pen,score:0.5*x+0.5*y-pen}};
  const T=total(X,Y),Tc=total(Xc,Yc);
  const quad=(X>=60?(Y>=60?'tr':'br'):(Y>=60?'tl':'bl'));
  const gap=Y-X;
  const L=k=>S.scores[k]??0;
  const cons=[];
  if(it.y4.capped) cons.push(['warn','护栏门槛生效','Y5 合规护栏不足 50%，「生产业务介入深度」按 50% 计。先补护栏，深度才算数。']);
  if(L('y3')>=3&&L('x2')<=1) cons.push(['warn','自相矛盾：Y3 × X2','AI 号称静默嵌入业务流，但系统几乎不可编程。AI 的结果是怎么写回系统的？多半是人肉胶水。']);
  if(L('y2')>=3&&L('x1')<=1) cons.push(['warn','自相矛盾：Y2 × X1','统一知识源打了高分，但系统没有打通。知识源的数据从哪来、谁来同步？']);
  if(L('y4')>=3&&L('x3')<=1) cons.push(['warn','自相矛盾：Y4 × X3','AI 介入核心生产，但缺乏确定性的自动化与回滚护栏。']);
  if(L('y4')>=3&&L('y1')<=1) cons.push(['danger','裸奔上产线','没有企业级基建，却让 AI 进入生产环节。']);
  const zy=Z_QS.filter(q=>S.z[q.id]===true).length, za=Z_QS.filter(q=>S.z[q.id]!==undefined).length;
  const stab=zy>=5?{k:'ok',n:'稳固',en:'Solid',r:12}:zy>=3?{k:'warn',n:'一般',en:'Wobbly',r:24}:{k:'danger',n:'易碎',en:'Fragile',r:38};
  stab.yes=zy; stab.ans=za;
  return{it,X,Y,Xc,Yc,T,Tc,quad,gap,cons,stab};
}

function resolvePersona(c){
  const h={c,raw:id=>c.it[id].raw,lv:id=>c.it[id].lv,trap:id=>S.traps[id]===true,z:S.z};
  const hit=PERSONA_RULES[c.quad].find(([,when])=>when(h));
  const p=PERSONAS[hit?hit[0]:`${c.quad}_default`];
  const complications=MUTATOR_RULES.filter(([,when])=>when(h)).map(([id])=>PERSONAS[id]);
  // 眼高手低：自评明显高于证据复核，且至少 3 个 Y 项自评 ≥75% 却拿不出证据。
  // 只看 yGap 的话，跳过证据勾选的人几乎全会中招。
  const yGap=r1(c.Y-c.Yc);
  const highNoEvid=Y_ITEMS.filter(i=>c.it[i.id].raw>=3&&!S.evid[i.id]).length;
  const dreamer=yGap>=15&&highNoEvid>=3;
  return{...p,dreamer,yGap,complications,fullTitle:dreamer?`眼高手低的梦想家 · ${p.name}`:p.name};
}

  const ref=[{x:95,y:92,n:'Google'}];

  <polygon points="${pts([[0,10],[90,100],[80,100],[0,20]])}" fill="var(--warn)" opacity=".16"/>
  <polygon points="${pts([[0,20],[80,100],[0,100]])}" fill="url(#hatch)"/>
  <line x1="${PX(0)}" y1="${PY(20)}" x2="${PX(80)}" y2="${PY(100)}" stroke="var(--danger)" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="${PX(60)}" y1="${PY(0)}" x2="${PX(60)}" y2="${PY(100)}" stroke="var(--ink)" stroke-width="1" opacity=".5"/>
  <line x1="${PX(0)}" y1="${PY(60)}" x2="${PX(100)}" y2="${PY(60)}" stroke="var(--ink)" stroke-width="1" opacity=".5"/>

  <g font-size="11" font-weight="700" fill="var(--ink)" font-family="var(--f-body)">
   <text x="${PX(2)}" y="${PY(97)}">幻觉裸奔区</text>
   <text x="${PX(98)}" y="${PY(97)}" text-anchor="end">AI 原生领航区</text>
   <text x="${PX(2)}" y="${PY(3)}">远古化石区</text>
   <text x="${PX(98)}" y="${PY(3)}" text-anchor="end">稳健蓄势区</text>
  </g>
  <text x="${PX(14)}" y="${PY(30)}" font-size="9.5" fill="var(--danger)" transform="rotate(-45 ${PX(14)} ${PY(30)})" font-family="var(--f-body)">地基失稳线</text>
  ${ticks}
  <text x="${PX(50)}" y="392" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="var(--f-body)">X 数字化成熟度 →</text>
  <text x="12" y="${PY(50)}" text-anchor="middle" font-size="11" fill="var(--muted)" transform="rotate(-90 12 ${PY(50)})" font-family="var(--f-body)">Y AI 接受与融合度 →</text>
  ${ref.map(r=>`<circle cx="${PX(r.x)}" cy="${PY(r.y)}" r="4" fill="var(--muted)"/><text x="${PX(r.x)-7}" y="${PY(r.y)+4}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="var(--f-body)">${r.n}（示意）</text>`).join('')}
  <line x1="${PX(c.X)}" y1="${PY(c.Y)}" x2="${PX(c.Xc)}" y2="${PY(c.Yc)}" stroke="var(--ink)" stroke-dasharray="3 3" opacity=".6"/>
  <circle class="pt" cx="${PX(c.Xc)}" cy="${PY(c.Yc)}" r="6" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/>
  <circle class="pt" cx="${PX(c.X)}" cy="${PY(c.Y)}" r="${c.stab.r}" fill="var(--accent)" fill-opacity=".12" stroke="var(--accent)" stroke-dasharray="3 3" stroke-opacity=".7"/>

function gapState(g){return g>20?['danger','地基失稳']:g>10?['warn','警戒带']:['ok','匹配']}
function renderReport(c){
  const Q=QUADS[c.quad];
  const gaps=ALL.map(i=>({i,loss:i.w*(1-LV[c.it[i.id].lv])})).filter(x=>x.loss>0).sort((a,b)=>b.loss-a.loss).slice(0,3);
  const hits=ALLTRAPS.filter(t=>S.traps[t.id]===true);
  const bar=i=>{const d=c.it[i.id];return `<div class="bar"><span>${i.id.toUpperCase()} ${i.name}</span><div class="track"><div class="fill" style="width:${LV[d.lv]*100}%"></div><div class="cons" style="width:${LV[d.clv]*100}%"></div></div><span class="v">${r1(d.score)}/${i.w}</span></div>`};
  document.getElementById('report').innerHTML=`
   <div class="card">
    <div class="eyebrow">象限判定</div>

   </div>
   <div class="card"><h3>优先补的三块短板</h3>
     ${gaps.length?`<ol>${gaps.map(g=>`<li><b>${g.i.id.toUpperCase()} ${g.i.name}</b>：还差 <span class="mono">${r1(g.loss)}</span> 分。下一档目标：${g.i.a[Math.min(2,Math.floor((c.it[g.i.id].lv+2)/2))]}</li>`).join('')}</ol>`:'<p>十项全部满分。请复核证据，满分通常意味着自评过于乐观。</p>'}
   </div>

    <div class="card"><h3>Y 轴明细</h3><div class="bars">${Y_ITEMS.map(bar).join('')}</div></div>

   </div>
   ${c.cons.length?`<div class="card"><h3>一致性检查</h3><ul>${c.cons.map(([t,b,s])=>`<li><span class="flag ${t}">${b}</span> ${s}</li>`).join('')}</ul></div>`:''}
   <div class="card"><h3>反模式整改清单（${hits.length}）</h3>

   </div>`;
}

function summaryText(){
  const c=compute(),Q=QUADS[c.quad],P=resolvePersona(c);
  const lines=[`【AI 原生双轴诊断】`,`综合分 ${r1(c.T.score)}｜X 数字化 ${r1(c.X)}｜Y AI 化 ${r1(c.Y)}｜Y−X ${r1(c.gap)}`,`象限：${Q.name} ${Q.en}`,`人格：${P.fullTitle}——${P.poster}`];
  if(P.complications.length) lines.push(`并发症：${P.complications.map(m=>m.name).join('、')}`);
  if(c.T.pen>0) lines.push('警示：地基失稳');
  lines.push(`组织稳定度：${c.stab.n}（${c.stab.yes}/6）`);
  lines.push('','各项得分：');
  ALL.forEach(i=>lines.push(`  ${i.id.toUpperCase()} ${i.name}：${r1(c.it[i.id].score)}/${i.w}${S.evid[i.id]?'':'（无证据）'}`));
  const hits=ALLTRAPS.filter(t=>S.traps[t.id]===true);
  if(hits.length){lines.push('','命中反模式：');hits.forEach(t=>lines.push(`  · ${t.t} → ${t.fix}`))}
  lines.push('','处方：');Q.rx.forEach((x,k)=>lines.push(`  ${k+1}. ${x}`));
  return lines.join('\n');
}

/* ---------- one question per screen ---------- */
const SECTIONS=[
 {name:'Y 轴 · AI 接受与融合度',steps:Y_ITEMS.map(i=>({k:'item',i}))},
 {name:'X 轴 · 数字化成熟度',steps:X_ITEMS.map(i=>({k:'item',i}))},
 {name:'组织稳定度',steps:Z_QS.map(q=>({k:'z',q}))},
];
const MAIN=SECTIONS.flatMap(sec=>sec.steps.map(st=>({...st,sec})));
const TRAP_STEPS=ALLTRAPS.map(t=>({k:'trap',t}));
const answered=st=>st.k==='item'?S.scores[st.i.id]!==undefined:st.k==='z'?S.z[st.q.id]!==undefined:S.traps[st.t.id]!==undefined;
const trapsAnswered=()=>TRAP_STEPS.filter(answered).length;
const firstOpen=list=>{const k=list.findIndex(st=>!answered(st));return k<0?list.length:k};

const app=document.getElementById('app'), shell=document.getElementById('shell');
function go(view){S.view=view;save();render();window.scrollTo({top:0,behavior:'instant'})}
function next(){
  const v=S.view;
  // 主线答完一律经过分岔页：反模式全答完的人（比如回头改答案）也要能再进去改
  if(v.s==='q') go(v.i<MAIN.length-1?{s:'q',i:v.i+1}:{s:'gate'});
  else if(v.s==='t') go(v.i<TRAP_STEPS.length-1?{s:'t',i:v.i+1}:{s:'result'});
}
function back(){
  const v=S.view;
  if(v.s==='q') go(v.i>0?{s:'q',i:v.i-1}:{s:'intro'});
  else if(v.s==='gate') go({s:'q',i:MAIN.length-1});
  else if(v.s==='t') go(v.i>0?{s:'t',i:v.i-1}:{s:'gate'});
}

function progressHTML(v){
  const cell=(st,cur)=>`<span class="cell${answered(st)?' done':''}${cur?' cur':''}"></span>`;

    :`<span><b>主线已完成</b></span><span class="mono">${MAIN.length} / ${MAIN.length}</span>`;
  return `<div class="prog-meta">${label}</div><div class="cells" aria-hidden="true">${groups}<span class="gap"></span>${traps}</div>`;

/* ---------- poster: 1080×1440 (3:4), drawn on canvas ---------- */
// 与结果页同一套视觉：羊皮纸底 + 纸色卡片、胡桃木墨色、黄铜强调、炭火色引言竖线。
// 海报固定用浅色版，不随看图人的深色模式变化。
const PF='"Fraunces","Noto Serif SC","Songti SC","STSong",serif';
const EMOJI='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const PC={bg:'#F3EADB',surface:'#FBF6EC',ink:'#2E2219',muted:'#7A6550',line:'#DCCAAE',accent:'#8B5A12',ember:'#C2582B',
  warn:'#946006',danger:'#9E2B25',dangerSoft:'#F3DAD3',
  tone:{ok:['#E2E7D0','#4F6B3A'],info:['#F1E1BF','#8B5A12'],warn:['#F4E4C1','#946006'],danger:['#F3DAD3','#9E2B25']},
  quad:{tr:'#E1E5CB',br:'#EAE0C8',tl:'#F2D8CB',bl:'#E8E1D5'}};
// 中文逐字断行；英文数字串整体不拆；收尾标点不放到行首。
const tokens=s=>s.match(/[A-Za-z0-9][A-Za-z0-9.+%#-]*|\s+|./gu)||[];
const NO_START=/^[，。、；：！？」』）》%…—]/;
function wrapLines(g,text,maxW){
  const lines=[];let line='';
  for(const t of tokens(text)){
    if(line.trim()&&g.measureText(line+t).width>maxW&&!NO_START.test(t)){lines.push(line.trimEnd());line=t.trimStart()}
    else line+=t;
  }
  if(line.trim()) lines.push(line.trimEnd());
  return lines;
}
function fitLines(g,text,font,maxW,maxLines){
  g.font=font; let lines=wrapLines(g,text,maxW);
  if(lines.length>maxLines){lines=lines.slice(0,maxLines);lines[maxLines-1]=lines[maxLines-1].replace(/.$/u,'…')}
  return lines;
}
function fitSize(g,text,weight,max,min,maxW){
  for(let s=max;s>min;s-=2){g.font=`${weight} ${s}px ${PF}`;if(g.measureText(text).width<=maxW) return s}
  return min;
}
function rrect(g,x,y,w,h,r){g.beginPath();if(g.roundRect) g.roundRect(x,y,w,h,r);else g.rect(x,y,w,h)}
function text(g,s,x,y,font,color,align='left'){g.font=font;g.fillStyle=color;g.textAlign=align;g.fillText(s,x,y)}

function drawMiniMap(g,x0,y0,size,X,Y,quad){
  const px=v=>x0+v/100*size, py=v=>y0+size-v/100*size;
  [['tl',0,60,60,100],['tr',60,60,100,100],['bl',0,0,60,60],['br',60,0,100,60]].forEach(([k,a,b,c,d])=>{
    g.globalAlpha=k===quad?1:.45; g.fillStyle=PC.quad[k]; g.fillRect(px(a),py(d),px(c)-px(a),py(b)-py(d));
  });
  g.globalAlpha=.3; g.strokeStyle=PC.ink; g.lineWidth=1.5;
  g.beginPath(); g.moveTo(px(60),py(0)); g.lineTo(px(60),py(100)); g.moveTo(px(0),py(60)); g.lineTo(px(100),py(60)); g.stroke();
  g.globalAlpha=1; g.strokeStyle=PC.line; g.lineWidth=2; g.strokeRect(x0,y0,size,size);
  g.fillStyle=PC.accent; g.beginPath(); g.arc(px(X),py(Y),10,0,Math.PI*2); g.fill();
  g.strokeStyle=PC.surface; g.lineWidth=3; g.stroke();
}
function drawQR(g,data,x,y,size){
  g.fillStyle='#FFFFFF'; rrect(g,x,y,size,size,12); g.fill(); g.strokeStyle=PC.line; g.lineWidth=2; g.stroke();
  if(typeof qrcode!=='function') return;
  const qr=qrcode(0,'M'); qr.addData(data); qr.make();
  const n=qr.getModuleCount(), pad=size*.09, cell=(size-pad*2)/n;
  g.fillStyle=PC.ink;
  for(let r=0;r<n;r++) for(let c=0;c<n;c++) if(qr.isDark(r,c)) g.fillRect(Math.floor(x+pad+c*cell),Math.floor(y+pad+r*cell),Math.ceil(cell),Math.ceil(cell));
}

async function renderPoster(o){
  const W=1080,H=1440,cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const g=cv.getContext('2d');
  const strings=[o.P.name,o.P.sub,o.P.poster,o.P.verdict,o.mascot,o.Q.name,o.top?`${o.top.id.toUpperCase()} ${o.top.name}`:'',...o.comps.map(m=>m.name),
    '企业 AI 人格画像 · 吉祥物图腾 No. / 16 判词 检出反模式并发副人格 所在象限 最强项 还在寻找中 眼高手低的梦想家 扫码 · 你也来测 rami0291.com/ainativebench 本工具不构成审计结论，结果仅供娱乐 X Y 0123456789'].join('');
  await Promise.all(['400','600','800'].map(w=>document.fonts.load(`${w} 40px ${PF}`,strings).catch(()=>{})));

  drawQR(g,o.url,qx,by,qs);
  text(g,'扫码 · 你也来测',qx+qs/2,by+qs+34,`400 22px ${PF}`,PC.muted,'center');

  // 卡片外页脚
  g.font=`600 23px ${PF}`; const u='rami0291.com/ainativebench', uw=g.measureText(u).width;
  g.font=`400 22px ${PF}`; const rest='　·　本工具不构成审计结论，结果仅供娱乐', rw=g.measureText(rest).width;
  const fx=(W-uw-rw)/2;
  text(g,u,fx,1414,`600 23px ${PF}`,PC.accent); text(g,rest,fx+uw,1414,`400 22px ${PF}`,PC.muted);
  return cv;
}

function strongest(c){
  const best=[...ALL].sort((a,b)=>LV[c.it[b.id].lv]-LV[c.it[a.id].lv]||b.w-a.w)[0];
  return LV[c.it[best.id].lv]>0?best:null;
}
const dlg=document.getElementById('shareDlg');
let posterBlob=null, posterURL='', posterLink='', posterName='';
async function drawShare(){
  const c=compute(),P=resolvePersona(c),Q=QUADS[c.quad];
  const d={p:P.id,x:Math.round(c.X),y:Math.round(c.Y),c:P.complications.map(m=>m.id),d:P.dreamer};
  posterLink=shareURL(d); posterName=`ai-persona-${P.id}.png`;
  const cv=await renderPoster({P,Q,X:d.x,Y:d.y,quad:c.quad,no:PERSONA_IDS.indexOf(P.id)+1,ico:P.mascot.split(' ')[0],
    mascot:P.mascot.split(' ').slice(1).join(' '),top:strongest(c),dreamer:P.dreamer,comps:P.complications,url:posterLink});
  posterBlob=await new Promise(r=>cv.toBlob(r,'image/png'));
  if(posterURL) URL.revokeObjectURL(posterURL);
  posterURL=URL.createObjectURL(posterBlob);
  document.getElementById('posterImg').src=posterURL;
  const file=new File([posterBlob],posterName,{type:'image/png'});
  dlg.querySelector('[data-share="native"]').hidden=!(navigator.canShare&&navigator.canShare({files:[file]}));
}
function openShare(){dlg.showModal();drawShare()}
dlg.addEventListener('click',async e=>{
  if(e.target===dlg) return dlg.close(); // 点遮罩关闭
  const act=e.target.closest('button')?.dataset.share;
  if(act==='close') dlg.close();
  else if(act==='download'&&posterURL){const a=document.createElement('a');a.href=posterURL;a.download=posterName;a.click()}
  else if(act==='native'&&posterBlob){try{await navigator.share({files:[new File([posterBlob],posterName,{type:'image/png'})],text:`测测你家是哪种企业 AI 人格 ${posterLink}`})}catch(err){}}
  else if(act==='link'){try{await navigator.clipboard.writeText(posterLink);toast('已复制分享链接')}catch(err){prompt('复制这个链接：',posterLink)}}
});
